apiVersion: 1

policies:
  - orgId: 1
    receiver: traffic-alerts
    group_by: ["alertname", "location"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: traffic-alerts
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 15m
